[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "familysearch"
version = "0.1.0"
description = "Client library for the FamilySearch API"
requires-python = ">=3.11"
dependencies = ["requests", "browser_cookie3", "mcp==1.30.0"]

[project.scripts]
familysearch-mcp = "familysearch_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest", "responses"]
import = ["pypdf", "pillow"]
film = ["pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
familysearch = ["api/registry.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
